services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by postgres/init/01-create-app-role.sh, not by Postgres itself.
      # POSTGRES_USER is a superuser (the official image's behavior) and
      # therefore bypasses RLS unconditionally — the app must connect as
      # this separate, non-superuser role instead. See that script and
      # migration 0002 for the rest of the story.
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs on a truly empty volume — see README.md if upgrading an
      # existing one.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    # Not exposed to the host — only other services on the internal network
    # reach Postgres. Cloudflare Tunnel has no reason to see this port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # Reached only over the internal network — by `frontend` (server-side
    # calls to http://backend:8000, including the Stripe/Clerk webhook
    # proxy routes — see frontend/app/api/webhooks/*/route.ts for why
    # webhooks go through Next.js rather than exposing this port
    # directly) and by celery-worker/celery-beat. Cloudflare Tunnel
    # routes to `frontend`, not here — its config is out of scope to
    # change, which is exactly why webhooks are proxied instead of this
    # port being opened.
    deploy:
      resources:
        limits:
          memory: 2g

  celery-worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # Catches the specific bug found in Phase 4 Task 3's live testing:
    # this service builds its OWN image from the same Dockerfile as
    # `backend` — rebuilding backend's image and recreating THIS
    # container is not enough to give it new code, and the container
    # comes up looking healthy regardless, with the only symptom being a
    # task silently discarded at runtime. See
    # scripts/check_worker_registration.py for the full story.
    # start_period is generous — mingle/boot plus this container's own
    # first apt/pip-free startup can take a few seconds under load.
    healthcheck:
      # timeout is generous, not decorative — confirmed live that a cold
      # `python3 scripts/...` invocation (fresh interpreter, celery's own
      # imports, a real 5s-budget broker round trip) takes ~13s in this
      # environment; 10s made every check fail on a timeout regardless of
      # whether registration was actually fine.
      test: ["CMD", "python3", "scripts/check_worker_registration.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  celery-beat:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          # beat only schedules tasks (celery-worker does the actual
          # work) — it's genuinely lightweight.
          memory: 512m

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      # The only host-exposed port — this is what Cloudflare Tunnel forwards
      # to.
      - "3000:3000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
